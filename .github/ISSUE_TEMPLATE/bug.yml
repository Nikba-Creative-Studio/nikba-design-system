name: Bug report
description: Report a reproducible design-system defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include markup, initialization, and exact steps or a small repository.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and assistive technology
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Accessibility or user impact
      description: Describe blocked tasks, keyboard or focus effects, and severity.
