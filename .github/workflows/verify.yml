name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build and verify package
        run: npm run verify:release

  native-ios:
    name: SwiftPM consumer and MCP examples
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install consumer project generator
        run: command -v xcodegen || brew install xcodegen
      - name: Check generated tokens
        run: npm run tokens:check
      - name: Compile MCP examples and test bundled fonts in an isolated SwiftPM app
        run: npm run test:native:ios -- --packed
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-ios-consumer
          path: artifacts/native-ios
          if-no-files-found: ignore

  native-android:
    name: Compose consumer and MCP examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install consumer SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Install locked dependencies
        run: npm ci
      - name: Compile exact MCP Kotlin sources and example
        run: npm run test:native:android
      - name: Upload native test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-android-consumer
          path: artifacts/native-android
          if-no-files-found: ignore

  browser:
    name: Browser accessibility and snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install snapshot browser
        run: npx playwright install --with-deps chromium
      - name: Build catalog
        run: npm run build
      - name: Check accessibility structure
        run: npm run test:a11y
      - name: Capture browser snapshots
        run: npm run test:browser
      - name: Upload browser snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-snapshots
          path: artifacts/browser
          if-no-files-found: error

  cross-browser:
    name: Cross-browser interaction smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build catalog
        run: npm run build
      - name: Verify browser interactions
        run: npm run test:cross-browser
      - name: Verify searchable controls and Data Table
        run: |
          for engine in chromium firefox webkit; do
            NDS_BROWSER=$engine node tests/combobox-browser.test.mjs
            NDS_BROWSER=$engine node tests/modules-browser.test.mjs
          done

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push'
    needs: [package, native-ios, native-android, browser, cross-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build GitHub Pages catalog
        run: npm run build:pages
      - name: Verify GitHub Pages paths
        run: npm run test:pages
      - name: Disable Jekyll processing
        run: touch dist-playground/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-playground
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
