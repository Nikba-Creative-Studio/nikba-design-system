name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build and verify package
        run: npm run verify

  browser:
    name: Browser accessibility and snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build catalog
        run: npm run build
      - name: Check accessibility structure
        run: npm run test:a11y
      - name: Capture browser snapshots
        run: npm run test:browser
      - name: Upload browser snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-snapshots
          path: artifacts/browser
          if-no-files-found: error

  cross-browser:
    name: Cross-browser interaction smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build catalog
        run: npm run build
      - name: Verify browser interactions
        run: npm run test:cross-browser

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push'
    needs: [package, browser, cross-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build GitHub Pages catalog
        run: npm run build:pages
      - name: Verify GitHub Pages paths
        run: npm run test:pages
      - name: Disable Jekyll processing
        run: touch dist-playground/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-playground
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
